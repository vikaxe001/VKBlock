<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Webbsidan är blockerad</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #333;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 520px;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
    }

    #blocked-address {
      color: #333;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 13px 24px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon">🔒</div>

    <h1>Webbsidan är blockerad</h1>

    <p>
      Webbplatsen
      <span id="blocked-address"></span>
      är inte tillgänglig för dig.
    </p>

    <a id="home-link" class="button"
       href="https://www.google.com/">
      ← Tillbaka till startsidan
    </a>

    <div class="footer">VKBlock</div>
  </main>

  <script src="blocked.js"></script>
</body>
</html>
